name: Build and deploy Studio501

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio501-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Generate catalogue and validate public pages
        run: |
          node scripts/build.mjs
          node scripts/validate.mjs
      - name: Prepare public files
        run: |
          mkdir _site
          cp -R about android apps assets confidentialite de en es it mentions-legales privacy pt-br support windows _site/
          cp .nojekyll CNAME 404.html index.html privacy.html universal-converter-privacy.html robots.txt sitemap.xml site.webmanifest apps.json _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
